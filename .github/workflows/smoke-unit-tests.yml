name: Smoke & unit tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Smoke & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: |
          node --check js/analysis/lexicon.js
          node --check js/analysis/stress.js
          node --check js/analysis/syllables.js
          node --check js/prosody.js
          node --check js/notation.js
          node --check js/render.js
          node --check js/ui.js
          node --check scripts/build-lexicon.mjs
      - name: Unit tests
        run: node --test tests/*.test.mjs
