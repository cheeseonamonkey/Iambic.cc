name: Smoke & unit tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Smoke & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build pronunciation lexicon
        run: |
          curl -fsSL https://raw.githubusercontent.com/cmusphinx/cmudict/74790861f652b15e4ac49015a90074ad62a27690/cmudict.dict -o /tmp/cmudict.dict
          node scripts/build-lexicon.mjs /tmp/cmudict.dict assets/pronunciations.bin
      - name: Syntax check
        run: |
          node --check js/prosody.js
          node --check js/notation.js
          node --check js/render.js
          node --check js/ui.js
          node --check sw.js
          node --check scripts/build-lexicon.mjs
      - name: Unit tests
        run: node --test tests/*.test.mjs
