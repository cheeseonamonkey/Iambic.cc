name: Validate poems

on:
  pull_request:
    paths:
      - poems.json
      - poems.schema.json
  push:
    branches: [main]
    paths:
      - poems.json
      - poems.schema.json

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate JSON and required fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          poems = json.loads(Path('poems.json').read_text())
          assert isinstance(poems, list) and poems, 'poems.json must be a non-empty array'
          required = {'title', 'author', 'text', 'license'}
          allowed = required | {'tags', 'source', 'excerpt'}

          for i, poem in enumerate(poems):
              assert isinstance(poem, dict), f'poem {i}: expected object'
              missing = required - poem.keys()
              extra = poem.keys() - allowed
              assert not missing, f'poem {i}: missing {sorted(missing)}'
              assert not extra, f'poem {i}: unknown fields {sorted(extra)}'
              for key in required:
                  assert isinstance(poem[key], str) and poem[key].strip(), f'poem {i}: invalid {key}'
              if 'tags' in poem:
                  assert isinstance(poem['tags'], list) and all(isinstance(x, str) and x.strip() for x in poem['tags']), f'poem {i}: invalid tags'
              if 'source' in poem:
                  assert isinstance(poem['source'], str), f'poem {i}: invalid source'
              if 'excerpt' in poem:
                  assert isinstance(poem['excerpt'], bool), f'poem {i}: invalid excerpt'

          print(f'Validated {len(poems)} poems.')
          PY
